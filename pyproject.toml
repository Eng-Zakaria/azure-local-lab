[project]
name = "cloudkit"
version = "0.1.0"
description = "One import, two targets: the same code talks to local emulators or real Azure, chosen by CLOUDKIT_MODE."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "azure-identity>=1.19",
  "azure-storage-blob>=12.24",
  "azure-eventhub>=5.13",
  "azure-servicebus>=7.13",
  "azure-keyvault-secrets>=4.9",
  "openai>=1.60",
  "psycopg[binary]>=3.2",
  "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29",
]

[project.optional-dependencies]
azure = ["azure-monitor-opentelemetry>=1.6"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose lab running"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
